[project]
name = "non-linear-steering"
version = "0.1.0"
description = "Nonlinear residual-stream steering with a learned probe and forward-KL constraint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0",
    "pydantic>=2.13.4",
    "safetensors>=0.4",
    "torch>=2.4",
    "tqdm>=4.66",
    "transformer-lens>=3.6.0",
    "transformers>=4.55",
]

[project.scripts]
nls = "non_linear_steering.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.2",
    "tokenizers>=0.20",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
